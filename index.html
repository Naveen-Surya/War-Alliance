<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WAR Alliance Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Rajdhani', sans-serif;
  background:
  linear-gradient(rgba(5,10,20,0.92), rgba(5,10,20,0.95)),
  url('https://images.unsplash.com/photo-1542751110-97427bbecf20?q=80&w=1600&auto=format&fit=crop');
  background-size:cover;
  background-attachment:fixed;
  color:white;
  padding:20px;
}

.container{
  max-width:1200px;
  margin:auto;
  background:rgba(15,23,42,0.94);
  border-radius:24px;
  overflow:hidden;
  border:1px solid rgba(96,165,250,0.2);
  box-shadow:
  0 0 40px rgba(37,99,235,0.25),
  0 0 80px rgba(0,0,0,0.6);
}

.topbar{
  padding:15px 20px;
  background:#0f172a;
  text-align:right;
}

.language-select{
  padding:10px;
  border-radius:10px;
  border:none;
  background:#334155;
  color:white;
  font-size:15px;
}

.header{
  padding:40px;
  text-align:center;
  background:
  linear-gradient(135deg,#2563eb,#0f172a);
}

.header h1{
  font-family:'Orbitron', sans-serif;
  font-size:42px;
  margin-bottom:10px;
}

.header p{
  font-size:20px;
  color:#dbeafe;
}

form{
  padding:30px;
}

.section{
  margin-bottom:35px;
  padding:25px;
  border-radius:20px;
  background:rgba(30,41,59,0.9);
}

.section h2{
  color:#60a5fa;
  margin-bottom:24px;
  font-size:24px;
}

.field{
  margin-bottom:22px;
}

label{
  display:block;
  margin-bottom:10px;
  font-size:18px;
  font-weight:600;
}

input, select{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#334155;
  color:white;
  font-size:16px;
}

.checkbox-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  margin-top:12px;
}

.checkbox-item{
  background:#334155;
  padding:12px;
  border-radius:12px;
  display:flex;
  align-items:center;
  gap:10px;
}

.checkbox-item input{
  width:auto;
}

.multi-note{
  margin-top:10px;
  color:#93c5fd;
  font-size:14px;
}

.hero-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.hero-card{
  background:#334155;
  border-radius:16px;
  padding:18px;
}

.hero-card h3{
  margin-bottom:14px;
}

button{
  width:100%;
  padding:18px;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.success{
  display:none;
  margin-top:20px;
  background:#15803d;
  padding:16px;
  border-radius:12px;
  text-align:center;
}

</style>
</head>

<body>

<div class="container">

<div class="topbar">

<select class="language-select" id="languageSwitcher">

<option value="en">🇺🇸 English</option>
<option value="ar">🇸🇦 العربية</option>
<option value="ru">🇷🇺 Русский</option>
<option value="tr">🇹🇷 Türkçe</option>
<option value="es">🇪🇸 Español</option>
<option value="fr">🇫🇷 Français</option>
<option value="de">🇩🇪 Deutsch</option>
<option value="pt">🇵🇹 Português</option>
<option value="it">🇮🇹 Italiano</option>
<option value="zh">🇨🇳 中文</option>
<option value="ja">🇯🇵 日本語</option>
<option value="ko">🇰🇷 한국어</option>

</select>

</div>

<div class="header">

<h1 id="title">⚔ WAR ALLIANCE ⚔</h1>

<p id="subtitle">
Event Availability & Joiner Hero Registration
</p>

</div>

<form>

<div class="section">

<h2 id="playerInfoTitle">Player Information</h2>

<div class="field">
<label id="playerNameLabel">Player Name</label>
<input type="text">
</div>

<div class="field">
<label id="timezoneLabel">Your Time Zone</label>
<input type="text">
</div>

</div>

<div class="section">

<h2 id="eventTitle">Event Preferences</h2>

<div class="field">

<label id="canyonLabel">Canyon Times</label>

<div class="checkbox-grid">

<label class="checkbox-item">
<input type="checkbox"> 02:00 UTC
</label>

<label class="checkbox-item">
<input type="checkbox"> 12:00 UTC
</label>

<label class="checkbox-item">
<input type="checkbox"> 14:00 UTC
</label>

<label class="checkbox-item">
<input type="checkbox"> 19:00 UTC
</label>

<label class="checkbox-item">
<input type="checkbox"> 21:00 UTC
</label>

</div>

<div class="multi-note" id="multiNote1">
✅ Multiple selections allowed
</div>

</div>

</div>

<div class="section">

<h2 id="heroTitle">Joiner Hero Skill Levels</h2>

<div class="hero-grid">

<div class="hero-card">
<h3>Reina</h3>
<select>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
</select>
</div>

<div class="hero-card">
<h3>Jessie</h3>
<select>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
</select>
</div>

<div class="hero-card">
<h3>Patrick</h3>
<select>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
</select>
</div>

</div>

</div>

<button id="submitBtn">
🚀 Submit Registration
</button>

<div class="success" id="successMessage">
✅ Registration Submitted Successfully!
</div>

</form>

</div>

<script>

const translations = {

en: {
  subtitle: "Event Availability & Joiner Hero Registration",
  playerInfoTitle: "Player Information",
  playerNameLabel: "Player Name",
  timezoneLabel: "Your Time Zone",
  eventTitle: "Event Preferences",
  canyonLabel: "Canyon Times",
  multiNote1: "✅ Multiple selections allowed",
  heroTitle: "Joiner Hero Skill Levels",
  submitBtn: "🚀 Submit Registration"
},

ar: {
  subtitle: "تسجيل أوقات الأحداث ومستويات الأبطال",
  playerInfoTitle: "معلومات اللاعب",
  playerNameLabel: "اسم اللاعب",
  timezoneLabel: "المنطقة الزمنية",
  eventTitle: "تفضيلات الأحداث",
  canyonLabel: "أوقات الكانيون",
  multiNote1: "✅ يمكن اختيار عدة خيارات",
  heroTitle: "مستويات مهارات الأبطال",
  submitBtn: "🚀 إرسال التسجيل"
},

ru: {
  subtitle: "Регистрация времени событий и героев",
  playerInfoTitle: "Информация игрока",
  playerNameLabel: "Имя игрока",
  timezoneLabel: "Ваш часовой пояс",
  eventTitle: "Настройки событий",
  canyonLabel: "Время Canyon",
  multiNote1: "✅ Можно выбрать несколько вариантов",
  heroTitle: "Уровни навыков героев",
  submitBtn: "🚀 Отправить"
},

tr: {
  subtitle: "Etkinlik Zamanı ve Kahraman Kayıt Formu",
  playerInfoTitle: "Oyuncu Bilgileri",
  playerNameLabel: "Oyuncu Adı",
  timezoneLabel: "Saat Diliminiz",
  eventTitle: "Etkinlik Tercihleri",
  canyonLabel: "Canyon Saatleri",
  multiNote1: "✅ Birden fazla seçim yapılabilir",
  heroTitle: "Kahraman Beceri Seviyeleri",
  submitBtn: "🚀 Kaydı Gönder"
}

};

document.getElementById("languageSwitcher")
.addEventListener("change", function(){

const lang = this.value;

if(translations[lang]){

Object.keys(translations[lang]).forEach(id => {

const el = document.getElementById(id);

if(el){

el.innerText = translations[lang][id];

}

});

}

});

</script>

</body>
</html>
